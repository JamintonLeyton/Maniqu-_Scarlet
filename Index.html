    <!-- BOTÓN DESPLEGABLE PRINCIPAL -->
    <button class="btn-principal" onclick="alternarMenu()">
      Maniquí Scarlet <span id="flechaMenu">▼</span>
    </button>

    <!-- PANELES DESPLEGABLES -->
    <div id="menuScarlet" class="grid-tarjetas" style="display: none;">
      
      <!-- PANEL 1: MOVER BRAZO / MOTOR -->
      <div class="tarjeta-panel">
        <div class="header-seccion">
          <span class="icono-modulo">🦾</span>
          <h2>Mover Brazo / Motor</h2>
        </div>

        <div class="grupo-checkbox">
          <label class="checkbox-label">
            <input type="checkbox" id="motorActivo">
            Habilitar motor
          </label>
        </div>

        <div class="grid-inputs">
          <div class="campo-control">
            <label>VEL. DERECHO (150-180)</label>
            <input type="number" id="velDer" min="0" max="255" value="160">
          </div>

          <div class="campo-control">
            <label>VEL. IZQUIERDO (150-180)</label>
            <input type="number" id="velIzq" min="0" max="255" value="160">
          </div>

          <div class="campo-control">
            <label>VELOCIDAD RETORNO (0-255)</label>
            <input type="number" id="velRet" min="0" max="255" value="100">
          </div>

          <div class="campo-control">
            <label>GIRO PRINCIPAL (MS)</label>
            <input type="number" id="t1" value="1000">
          </div>

          <div class="campo-control">
            <label>PAUSA TRAS GIRO (MS)</label>
            <input type="number" id="p1" value="500">
          </div>

          <div class="campo-control">
            <label>GIRO RETORNO (MS)</label>
            <input type="number" id="t2" value="1000">
          </div>
        </div>

        <div class="campo-control" style="margin-bottom: 24px;">
          <label>PAUSA FINAL (MS)</label>
          <input type="number" id="p2" value="200">
        </div>

        <button class="btn-guardar" onclick="guardarMotor()">
          Guardar Movimiento
        </button>
      </div>

      <!-- PANEL 2: AUDIO / MP3 -->
      <div class="tarjeta-panel">
        <div class="header-seccion">
          <span class="icono-modulo">🎵</span>
          <h2>Audio / MP3</h2>
        </div>

        <div class="control-pista-flex">
          <div class="grupo-btn-nav">
            <button type="button" class="btn-nav-audio" onclick="fetch('/audio/anterior')">⏮️ Anterior</button>
            <button type="button" class="btn-nav-audio" onclick="fetch('/audio/siguiente')">Siguiente ⏭️</button>
          </div>
        </div>

        <div class="bloque-volumen">
          <label>Volumen (0 a 60): <strong id="valVolumen">60</strong></label>
          <input type="range" id="volAudio" min="0" max="60" value="60" class="slider-volumen" oninput="document.getElementById('valVolumen').innerText = this.value">
        </div>

        <div class="grupo-checkbox">
          <label class="checkbox-label">
            <input type="checkbox" id="audioAuto">
            Reproducción automática
          </label>
        </div>

        <div class="grid-inputs">
          <div class="campo-control">
            <label>REPETIR CADA (S)</label>
            <input type="number" id="audInt" value="10">
          </div>

          <div class="campo-control">
            <label>DURACIÓN (S)</label>
            <input type="number" id="audDur" value="30">
          </div>
        </div>

        <button class="btn-guardar" onclick="guardarAudio()">
          Guardar Audio
        </button>
      </div>

    </div>

  </div>
